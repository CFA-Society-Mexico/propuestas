name: Recordatorio de propuestas

# Pings the maintainers when a project proposal has had no activity for
# 14 days. Never closes issues and never touches pull requests.
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  recordatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-labels: propuesta
          days-before-stale: 14
          days-before-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: sin-respuesta
          stale-issue-message: >
            Recordatorio para @edgarcalderonmx y @alanvaa06: esta propuesta lleva
            14 días sin actividad. / Reminder: this proposal has had no activity
            for 14 days.
